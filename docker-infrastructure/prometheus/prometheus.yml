global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metricas de todos los servicios, ya convertidas por el collector (llegan por OTLP).
  - job_name: store-services
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Salud del propio collector (spans/metricas aceptados y descartados).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Plugin rabbitmq_prometheus, agregado (conexiones, canales, tasas globales).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Lo mismo por cola: mensajes listos / sin confirmar y consumidores (incluye las colas .error).
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
